<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Ngày 20/10!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Container chính */
        .container {
            text-align: center;
            position: relative;
            z-index: 10;
        }

        /* Hộp quà */
        .gift-box {
            font-size: 100px;
            cursor: pointer;
            transition: transform 0.3s ease;
            animation: bounce 1.5s infinite alternate;
            user-select: none;
        }

        .gift-box:hover {
            transform: scale(1.15) rotate(5deg);
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-20px); }
        }

        .instruction {
            margin-top: 15px;
            font-size: 1.2rem;
            color: #d63384;
            font-weight: bold;
            animation: fadeIn 2s infinite alternate;
        }

        /* Popup Lá Thư */
        .card {
            display: none;
            background: #ffffff;
            padding: 30px 25px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            max-width: 90vw;
            width: 400px;
            border: 2px solid #ffb6c1;
            position: relative;
            animation: popUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popUp {
            0% { transform: scale(0.3); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .card h2 {
            color: #d63384;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }

        .wish-text {
            font-size: 1.1rem;
            color: #4a4a4a;
            line-height: 1.6;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        /* Nút bấm */
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 25px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 71, 87, 0.3);
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: #e84118;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #70a1ff;
            box-shadow: 0 4px 10px rgba(112, 161, 255, 0.3);
        }

        .btn-secondary:hover {
            background: #1e90ff;
        }

        /* Hiệu ứng bong bóng tim bay */
        .heart {
            position: absolute;
            color: #ff6b81;
            font-size: 20px;
            pointer-events: none;
            animation: floatUp 4s linear forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.3); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Âm thanh nền (Thay link nhạc của bạn tại đây) -->
    <audio id="bg-music" loop>
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <!-- Hộp quà ban đầu -->
        <div id="gift-wrapper">
            <div class="gift-box" onclick="openGift()">🎁</div>
            <div class="instruction">Bấm vào hộp quà để mở điều bất ngờ! ✨</div>
        </div>

        <!-- Lá thư chúc mừng -->
        <div class="card" id="card">
            <h2>🌸 Chúc Mừng 20/10 🌸</h2>
            <div class="wish-text" id="wish"></div>
            <div class="btn-group">
                <button class="btn" onclick="getRandomWish()">Lá thư khác 💌</button>
                <button class="btn btn-secondary" onclick="toggleMusic()">Bật/Tắt Nhạc 🎵</button>
            </div>
        </div>
    </div>

    <script>
        // 📜 DANH SÁCH LỜI CHÚC (Bạn thoải mái thêm/sửa/xóa các dòng ở đây)
        const wishes = [
            "Chúc bạn một ngày 20/10 thật nhiều niềm vui, luôn xinh đẹp, rạng rỡ và hạnh phúc bên những người thân yêu! 💐",
            "Chúc bạn luôn giữ vững nụ cười trên môi, công việc thuận lợi và gặt hái được thật nhiều thành công nhé! ✨",
            "Ngày 20/10 chúc bạn nhận được thật nhiều quà, nhiều hoa và tràn ngập những lời chúc ngọt ngào nhất! 🎁",
            "Cảm ơn vì đã luôn là một phần tuyệt vời. Chúc bạn mỗi ngày trôi qua đều ngọt ngào và bình yên như ngày hôm nay! 💖",
            "Chúc bạn tuổi mới/ngày mới luôn yêu đời, tự tin bước đi trên con đường mình chọn và luôn tỏa sáng! 🌟"
        ];

        let isMusicPlaying = false;
        const music = document.getElementById("bg-music");

        // Hàm mở hộp quà
        function openGift() {
            document.getElementById("gift-wrapper").style.display = "none";
            document.getElementById("card").style.display = "block";
            
            // Tự động bật nhạc khi mở quà
            music.play().then(() => {
                isMusicPlaying = true;
            }).catch(e => console.log("Trình duyệt chặn tự động phát nhạc"));

            getRandomWish();
            createHeartRain();
        }

        // Hàm lấy lời chúc ngẫu nhiên
        function getRandomWish() {
            const randomIndex = Math.floor(Math.random() * wishes.length);
            document.getElementById("wish").innerText = wishes[randomIndex];
            createSingleHeart();
        }

        // Bật / Tắt nhạc
        function toggleMusic() {
            if (isMusicPlaying) {
                music.pause();
                isMusicPlaying = false;
            } else {
                music.play();
                isMusicPlaying = true;
            }
        }

        // Tạo hiệu ứng tim bay ngẫu nhiên
        function createSingleHeart() {
            const heart = document.createElement("div");
            heart.classList.add("heart");
            heart.innerHTML = ["💖", "🌸", "🌷", "✨", "❤️"][Math.floor(Math.random() * 5)];
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = (Math.random() * 2 + 3) + "s";
            document.body.appendChild(heart);

            setTimeout(() => { heart.remove(); }, 4000);
        }

        function createHeartRain() {
            for (let i = 0; i < 15; i++) {
                setTimeout(createSingleHeart, i * 200);
            }
        }
    </script>
</body>
</html>
