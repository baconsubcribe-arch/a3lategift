<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Ngày 20/10!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Container chính */
        .container {
            text-align: center;
            position: relative;
            z-index: 10;
        }

        /* Hộp quà */
        .gift-box {
            font-size: 100px;
            cursor: pointer;
            transition: transform 0.3s ease;
            animation: bounce 1.5s infinite alternate;
            user-select: none;
        }

        .gift-box:hover {
            transform: scale(1.15) rotate(5deg);
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-20px); }
        }

        .instruction {
            margin-top: 15px;
            font-size: 1.2rem;
            color: #d63384;
            font-weight: bold;
            animation: fadeIn 2s infinite alternate;
        }

        /* Popup Lá Thư */
        .card {
            display: none;
            background: #ffffff;
            padding: 35px 25px 25px 25px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            max-width: 90vw;
            width: 400px;
            border: 2px solid #ffb6c1;
            position: relative;
            animation: popUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popUp {
            0% { transform: scale(0.3); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .card h2 {
            color: #d63384;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }

        .wish-text {
            font-size: 1.15rem;
            color: #4a4a4a;
            line-height: 1.6;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            font-style: italic;
        }

        /* Nút Âm Thanh */
        .btn-music {
            background: #70a1ff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(112, 161, 255, 0.3);
            transition: all 0.2s ease;
        }

        .btn-music:hover {
            background: #1e90ff;
            transform: translateY(-2px);
        }

        /* Hiệu ứng tim bay */
        .heart {
            position: absolute;
            color: #ff6b81;
            font-size: 20px;
            pointer-events: none;
            animation: floatUp 4s linear forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.3); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Âm thanh nền (Thay link nhạc mp3 của bạn tại đây) -->
    <audio id="bg-music" loop>
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <!-- Hộp quà ban đầu -->
        <div id="gift-wrapper">
            <div class="gift-box" onclick="openGift()">🎁</div>
            <div class="instruction">Bấm vào hộp quà để nhận điều may mắn! ✨</div>
        </div>

        <!-- Lá thư ngẫu nhiên -->
        <div class="card" id="card">
            <h2> Lời Chúc Dành Cho Bạn </h2>
            <div class="wish-text" id="wish"></div>
            <div>
                <button class="btn-music" onclick="toggleMusic()">Bật / Tắt Nhạc 🎵</button>
            </div>
        </div>
    </div>

    <script>
        // 📜 DANH SÁCH LỜI CHÚC NGẪU NHIÊN (Bạn thay đổi/thêm lời chúc ở đây)
        const wishes = [
            "« Chúc bạn một ngày 20/10 thật nhiều niềm vui, luôn xinh đẹp, rạng rỡ và tràn ngập hạnh phúc!  »",
            "« Chúc bạn luôn giữ vững nụ cười trên môi, mọi điều may mắn và thành công luôn mỉm cười với bạn!  »",
            "« Ngày 20/10 chúc bạn nhận được thật nhiều quà, nhiều hoa và trọn vẹn sự yêu thương!  »",
            "« Cảm ơn bạn vì đã luôn là một mảnh ghép tuyệt vời. Chúc bạn một ngày ngọt ngào và dịu dàng như hoa!  »",
            "« Chúc bạn luôn tự tin bước đi trên con đường mình đã chọn, luôn tỏa sáng và hạnh phúc mỗi ngày!  »"
        ];

        let isMusicPlaying = false;
        const music = document.getElementById("bg-music");

        // Hàm khi người dùng bấm mở hộp quà
        function openGift() {
            document.getElementById("gift-wrapper").style.display = "none";
            document.getElementById("card").style.display = "block";
            
            // Tự động bốc 1 lời chúc ngẫu nhiên từ danh sách
            const randomIndex = Math.floor(Math.random() * wishes.length);
            document.getElementById("wish").innerText = wishes[randomIndex];

            // Tự động phát nhạc
            music.play().then(() => {
                isMusicPlaying = true;
            }).catch(e => console.log("Trình duyệt hạn chế tự động phát nhạc"));

            // Phun tim lung linh
            createHeartRain();
        }

        // Bật / Tắt Nhạc
        function toggleMusic() {
            if (isMusicPlaying) {
                music.pause();
                isMusicPlaying = false;
            } else {
                music.play();
                isMusicPlaying = true;
            }
        }

        // Tạo hiệu ứng tim bay
        function createSingleHeart() {
            const heart = document.createElement("div");
            heart.classList.add("heart");
            heart.innerHTML = ["💖", "🌸", "🌷", "✨", "❤️"][Math.floor(Math.random() * 5)];
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = (Math.random() * 2 + 3) + "s";
            document.body.appendChild(heart);

            setTimeout(() => { heart.remove(); }, 4000);
        }

        function createHeartRain() {
            for (let i = 0; i < 20; i++) {
                setTimeout(createSingleHeart, i * 150);
            }
        }
    </script>
</body>
</html>
