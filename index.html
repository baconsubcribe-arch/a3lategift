<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chúc Mừng Ngày 20/10!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ----- SLIDER ẢNH NỀN LƯỚT QUA LẠI ----- */
        .bg-slider {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
        }

        .bg-slide {
            position: absolute;
            top: -15%;
            left: -15%;
            width: 130%;
            height: 130%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            animation: moveAround 12s infinite alternate ease-in-out;
        }

        .bg-slide:nth-child(even) {
            animation-direction: alternate-reverse;
        }

        .bg-slide.active {
            opacity: 1;
        }

        @keyframes moveAround {
            0% {
                transform: translate(-5%, -5%) scale(1);
            }
            50% {
                transform: translate(5%, 3%) scale(1.08);
            }
            100% {
                transform: translate(-3%, 5%) scale(1.03);
            }
        }

        /* ----- CONTAINER CHÍNH (Đã tối ưu cho mobile) ----- */
        .container {
            text-align: center;
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 420px;
            padding: 10px;
        }

        /* Hộp quà */
        .gift-box {
            font-size: 85px;
            cursor: pointer;
            transition: transform 0.3s ease;
            animation: bounce 1.5s infinite alternate;
            user-select: none;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
            display: inline-block;
        }

        .gift-box:active, .gift-box:hover {
            transform: scale(1.15) rotate(5deg);
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-18px); }
        }

        .instruction {
            margin-top: 15px;
            font-size: 1.15rem;
            color: #ffffff;
            font-weight: 600;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9), 0 0 6px rgba(0, 0, 0, 0.9);
            animation: fadeIn 2s infinite alternate;
            line-height: 1.4;
        }

        /* Lá thư chúc mừng */
        .card {
            display: none;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 30px 20px 22px 20px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            width: 100%;
            border: 2px solid #ffb6c1;
            position: relative;
            animation: popUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popUp {
            0% { transform: scale(0.3); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .card h2 {
            color: #d63384;
            margin-bottom: 15px;
            font-size: 1.35rem;
        }

        .wish-text {
            font-size: 1.05rem;
            color: #333333;
            line-height: 1.6;
            min-height: 85px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            font-style: italic;
            word-wrap: break-word;
        }

        .btn-music {
            background: #ff4757;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 71, 87, 0.4);
            transition: all 0.2s ease;
        }

        .btn-music:active {
            transform: scale(0.95);
        }

        .heart {
            position: absolute;
            color: #ff6b81;
            font-size: 22px;
            pointer-events: none;
            z-index: 15;
            animation: floatUp 4s linear forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.3); opacity: 0; }
        }

        /* Tối ưu riêng cho màn hình điện thoại nhỏ */
        @media (max-height: 600px) {
            .gift-box { font-size: 70px; }
            .instruction { font-size: 1rem; }
            .card { padding: 20px 15px; }
            .wish-text { font-size: 0.95rem; min-height: 70px; }
        }
    </style>
</head>
<body>

    <!-- Slider Ảnh Nền -->
    <div class="bg-slider" id="bgSlider"></div>

    <!-- Nhạc nền -->
    <audio id="bg-music" loop autoplay src="mysong.mp3"></audio>

    <div class="container">
        <!-- Hộp quà ban đầu -->
        <div id="gift-wrapper">
            <div class="gift-box" onclick="openGift()">🎁</div>
            <div class="instruction">Bấm vào hộp quà để mở điều đặc biệt! ✨</div>
        </div>

        <!-- Lá thư ngẫu nhiên -->
        <div class="card" id="card">
            <h2>🌸 Lời Chúc Dành Cho Bạn 🌸</h2>
            <div class="wish-text" id="wish"></div>
            <div>
                <button class="btn-music" onclick="toggleMusic()">Bật / Tắt Nhạc 🎵</button>
            </div>
        </div>
    </div>

    <script>
        // 🖼️ 1. DANH SÁCH ẢNH NỀN
        const myPhotos = [
            "anh1.jpg",
            "anh2.jpg",
            "anh3.jpg",
            "anh4.jpg",
            "anh5.jpg"
        ];

        // 📜 2. DANH SÁCH LỜI CHÚC NGẪU NHIÊN
        const wishes = [
            "« Chúc bạn một ngày 20/10 thật nhiều niềm vui, luôn xinh đẹp, rạng rỡ và tràn ngập hạnh phúc! 💐 »",
            "« Chúc bạn luôn giữ vững nụ cười trên môi, mọi điều may mắn và thành công luôn mỉm cười với bạn! ✨ »",
            "« Ngày 20/10 chúc bạn nhận được thật nhiều quà, nhiều hoa và trọn vẹn sự yêu thương! 🎁 »",
            "« Cảm ơn bạn vì đã luôn là một mảnh ghép tuyệt vời. Chúc bạn một ngày ngọt ngào và dịu dàng như hoa! 💖 »",
            "« Chúc bạn luôn tự tin bước đi trên con đường mình đã chọn, luôn tỏa sáng và hạnh phúc mỗi ngày! 🌟 »"
        ];

        // Khởi tạo Slider
        const sliderContainer = document.getElementById("bgSlider");
        myPhotos.forEach((photoUrl, index) => {
            const slide = document.createElement("div");
            slide.classList.add("bg-slide");
            if (index === 0) slide.classList.add("active");
            slide.style.backgroundImage = `url('${photoUrl}')`;
            sliderContainer.appendChild(slide);
        });

        // Chuyển ảnh nền mỗi 5 giây
        let currentSlide = 0;
        const slides = document.querySelectorAll(".bg-slide");
        setInterval(() => {
            slides[currentSlide].classList.remove("active");
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add("active");
        }, 5000);

        // 🎵 QUẢN LÝ PHÁT NHẠC
        let isMusicPlaying = false;
        const music = document.getElementById("bg-music");

        function playMusic() {
            if (!isMusicPlaying) {
                music.play().then(() => {
                    isMusicPlaying = true;
                }).catch(e => {
                    console.log("Trình duyệt chờ tương tác để phát nhạc.");
                });
            }
        }

        window.addEventListener("load", playMusic);
        document.addEventListener("click", playMusic, { once: true });
        document.addEventListener("touchstart", playMusic, { once: true });

        function openGift() {
            document.getElementById("gift-wrapper").style.display = "none";
            document.getElementById("card").style.display = "block";
            
            const randomIndex = Math.floor(Math.random() * wishes.length);
            document.getElementById("wish").innerText = wishes[randomIndex];

            playMusic();
            createHeartRain();
        }

        function toggleMusic() {
            if (isMusicPlaying) {
                music.pause();
                isMusicPlaying = false;
            } else {
                music.play();
                isMusicPlaying = true;
            }
        }

        function createSingleHeart() {
            const heart = document.createElement("div");
            heart.classList.add("heart");
            heart.innerHTML = ["💖", "🌸", "🌷", "✨", "❤️"][Math.floor(Math.random() * 5)];
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = (Math.random() * 2 + 3) + "s";
            document.body.appendChild(heart);

            setTimeout(() => { heart.remove(); }, 4000);
        }

        function createHeartRain() {
            for (let i = 0; i < 20; i++) {
                setTimeout(createSingleHeart, i * 150);
            }
        }
    </script>
</body>
</html>
