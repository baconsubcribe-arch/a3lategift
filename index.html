<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Ngày 20/10!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
            background-color: #000;
        }

        /* ----- SLIDER ẢNH NỀN ----- */
        .bg-slider {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .bg-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1.5s ease-in-out, transform 6s ease-in-out;
            transform: scale(1);
        }

        .bg-slide.active {
            opacity: 1;
            transform: scale(1.08); /* Hiệu ứng phóng to nhẹ giúp ảnh sống động */
        }

        /* Lớp phủ làm tối/hồng nhẹ nền để nổi bật hộp quà & thư */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45); /* Làm mờ ảnh nền một chút để dễ đọc chữ */
            z-index: 2;
        }

        /* ----- CONTAINER CHÍNH ----- */
        .container {
            text-align: center;
            position: relative;
            z-index: 10;
        }

        /* Hộp quà */
        .gift-box {
            font-size: 100px;
            cursor: pointer;
            transition: transform 0.3s ease;
            animation: bounce 1.5s infinite alternate;
            user-select: none;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
        }

        .gift-box:hover {
            transform: scale(1.15) rotate(5deg);
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-20px); }
        }

        .instruction {
            margin-top: 15px;
            font-size: 1.2rem;
            color: #ffffff;
            font-weight: bold;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
            animation: fadeIn 2s infinite alternate;
        }

        /* Lá thư chúc */
        .card {
            display: none;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(5px);
            padding: 35px 25px 25px 25px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            max-width: 90vw;
            width: 400px;
            border: 2px solid #ffb6c1;
            position: relative;
            animation: popUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popUp {
            0% { transform: scale(0.3); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .card h2 {
            color: #d63384;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }

        .wish-text {
            font-size: 1.15rem;
            color: #333333;
            line-height: 1.6;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            font-style: italic;
        }

        /* Nút âm thanh */
        .btn-music {
            background: #ff4757;
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: 25px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 71, 87, 0.4);
            transition: all 0.2s ease;
        }

        .btn-music:hover {
            background: #e84118;
            transform: translateY(-2px);
        }

        /* Hiệu ứng tim bay */
        .heart {
            position: absolute;
            color: #ff6b81;
            font-size: 24px;
            pointer-events: none;
            z-index: 15;
            animation: floatUp 4s linear forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.3); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Slider Ảnh Nền (Thay danh sách tên ảnh của bạn ở đây) -->
    <div class="bg-slider" id="bgSlider"></div>
    <div class="overlay"></div>

    <!-- Nhạc nền (Thay tên file mp3 của bạn) -->
    <audio id="bg-music" loop>
        <source src="nhac-cua-toi.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <!-- Hộp quà ban đầu -->
        <div id="gift-wrapper">
            <div class="gift-box" onclick="openGift()">🎁</div>
            <div class="instruction">Bấm vào hộp quà để mở điều đặc biệt! ✨</div>
        </div>

        <!-- Lá thư ngẫu nhiên -->
        <div class="card" id="card">
            <h2> Lời Chúc Dành Cho Bạn </h2>
            <div class="wish-text" id="wish"></div>
            <div>
                <button class="btn-music" onclick="toggleMusic()">Bật / Tắt Nhạc 🎵</button>
            </div>
        </div>
    </div>

    <script>
        // 🖼️ 1. DANH SÁCH TÊN BỨC ẢNH CỦA BẠN (Đã upload lên GitHub)
        const myPhotos = [
            "anh1.jpg",
            "anh2.jpg",
            "anh3.jpg",
            "anh4.jpg",
            "anh5.jpg",
            "anh6.jpg"
        ];

        // 📜 2. DANH SÁCH LỜI CHÚC NGẪU NHIÊN
        const wishes = [
            "« Chúc bạn một ngày 20/10 thật nhiều niềm vui, luôn xinh đẹp, rạng rỡ và tràn ngập hạnh phúc!  »",
            "« Chúc bạn luôn giữ vững nụ cười trên môi, mọi điều may mắn và thành công luôn mỉm cười với bạn!  »",
            "« Ngày 20/10 chúc bạn nhận được thật nhiều quà, nhiều hoa và trọn vẹn sự yêu thương!  »",
            "« Cảm ơn bạn vì đã luôn là một mảnh ghép tuyệt vời. Chúc bạn một ngày ngọt ngào và dịu dàng như hoa!  »",
            "« Chúc bạn luôn tự tin bước đi trên con đường mình đã chọn, luôn tỏa sáng và hạnh phúc mỗi ngày!  »"
        ];

        // Khởi tạo Slide ảnh
        const sliderContainer = document.getElementById("bgSlider");
        myPhotos.forEach((photoUrl, index) => {
            const slide = document.createElement("div");
            slide.classList.add("bg-slide");
            if (index === 0) slide.classList.add("active");
            slide.style.backgroundImage = `url('${photoUrl}')`;
            sliderContainer.appendChild(slide);
        });

        // Tự động chuyển ảnh nền sau mỗi 3.5 giây
        let currentSlide = 0;
        const slides = document.querySelectorAll(".bg-slide");
        setInterval(() => {
            slides[currentSlide].classList.remove("active");
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add("active");
        }, 3500);

        // Phát nhạc & Mở quà
        let isMusicPlaying = false;
        const music = document.getElementById("bg-music");

        function openGift() {
            document.getElementById("gift-wrapper").style.display = "none";
            document.getElementById("card").style.display = "block";
            
            const randomIndex = Math.floor(Math.random() * wishes.length);
            document.getElementById("wish").innerText = wishes[randomIndex];

            music.play().then(() => {
                isMusicPlaying = true;
            }).catch(e => console.log("Trình duyệt hạn chế autoplay"));

            createHeartRain();
        }

        function toggleMusic() {
            if (isMusicPlaying) {
                music.pause();
                isMusicPlaying = false;
            } else {
                music.play();
                isMusicPlaying = true;
            }
        }

        function createSingleHeart() {
            const heart = document.createElement("div");
            heart.classList.add("heart");
            //heart.innerHTML = ["💖", "🌸", "🌷", "✨", "❤️"][Math.floor(Math.random() * 5)];
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = (Math.random() * 2 + 3) + "s";
            document.body.appendChild(heart);

            setTimeout(() => { heart.remove(); }, 4000);
        }

        function createHeartRain() {
            for (let i = 0; i < 20; i++) {
                setTimeout(createSingleHeart, i * 150);
            }
        }
    </script>
</body>
</html>
